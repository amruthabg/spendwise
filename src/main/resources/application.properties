# Server configuration
server.port=8081

# Spring App Name
spring.application.name=spendwise

# ==========================================
# DATABASE CONFIGURATION: H2 (Default for local running)
# ==========================================
spring.datasource.url=jdbc:h2:mem:spendwisedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# DATABASE CONFIGURATION: MySQL (Uncomment to use MySQL)
# ==========================================
# spring.datasource.url=jdbc:mysql://localhost:3306/spendwise_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Uncomment below line when switching to MySQL:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show request validation errors clearly in development
server.error.include-message=always
